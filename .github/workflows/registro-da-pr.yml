name: Registro da PR

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: registro-da-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  registro-da-pr:
    name: Registro da PR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Usar as regras da base
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if git cat-file -e "origin/$BASE:scripts/freios/registro_da_pr.py" 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/freios-da-base"
            git archive "origin/$BASE" scripts/freios | tar -x -C "$RUNNER_TEMP/freios-da-base"
            echo "FREIOS_RAIZ=$RUNNER_TEMP/freios-da-base" >> "$GITHUB_ENV"
          else
            echo "FREIOS_RAIZ=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi
      - name: Registro da PR
        run: |
          cd "$FREIOS_RAIZ"
          python -m scripts.freios.registro_da_pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
