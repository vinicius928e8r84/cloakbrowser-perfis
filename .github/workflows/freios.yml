name: Freios

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: freios-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  freios:
    name: Freios
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FREIOS_RAMO: ${{ github.head_ref }}
      FREIOS_AUTOR_DA_PR: ${{ github.event.pull_request.user.login }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.2"
      - name: Usar os freios da base
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if git cat-file -e "origin/$BASE:scripts/freios/freios.py" 2>/dev/null; then
            rm -rf scripts/freios
            git archive "origin/$BASE" scripts/freios | tar -x
            echo "FREIOS_DA_BASE=1" >> "$GITHUB_ENV"
            echo "freios da base origin/$BASE: a PR não consegue afrouxá-los"
          else
            echo "a base ainda não tem os freios: usando os da PR (só acontece na PR que os cria)"
          fi
      - name: Instalar ruff e ESLint
        run: |
          python -m pip install --disable-pip-version-check -r scripts/freios/requirements.txt
          npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/freios
      - name: Freios
        run: |
          set -o pipefail
          python scripts/freios/freios.py --tudo --sem-testes 2>&1 | tee "$RUNNER_TEMP/freios.txt"
      - name: Voltar aos freios da PR
        if: ${{ !cancelled() && env.FREIOS_DA_BASE == '1' }}
        run: |
          rm -rf scripts/freios
          git checkout -- scripts/freios
      - name: Instalar ruff e ESLint da PR
        if: ${{ !cancelled() && env.FREIOS_DA_BASE == '1' }}
        run: |
          python -m pip install --disable-pip-version-check -r scripts/freios/requirements.txt
          npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/freios
      - name: Freios nos arquivos da PR
        if: ${{ !cancelled() && env.FREIOS_DA_BASE == '1' }}
        run: |
          set -o pipefail
          python scripts/freios/freios.py --tudo --sem-testes 2>&1 | tee "$RUNNER_TEMP/freios-da-pr.txt"
      - name: Nenhuma ferramenta pulada
        if: ${{ !cancelled() }}
        run: python -m scripts.freios.sem_pulo "$RUNNER_TEMP"/freios*.txt
      - name: Testes
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s scripts/freios -t .
